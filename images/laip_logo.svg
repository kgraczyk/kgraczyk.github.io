<svg viewBox="0 0 680 320" width="680" height="320" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>LAIP — Laboratory of AI for Physics</title>
  <desc>A geometric logo combining a neural network lattice with orbital ellipses, alongside the LAIP wordmark and full lab name.</desc>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;700&display=swap');
  </style>

  <rect width="680" height="320" fill="white"/>

  <g transform="translate(118, 160)">
    <ellipse cx="0" cy="0" rx="72" ry="26" fill="none" stroke="#1A6FBF" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.55"/>
    <ellipse cx="0" cy="0" rx="72" ry="26" fill="none" stroke="#1A6FBF" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.55" transform="rotate(60)"/>
    <ellipse cx="0" cy="0" rx="72" ry="26" fill="none" stroke="#1A6FBF" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.55" transform="rotate(120)"/>

    <line x1="60" y1="-35" x2="60" y2="35" stroke="#2D9CDB" stroke-width="0.8" opacity="0.4"/>
    <line x1="60" y1="-35" x2="-60" y2="-35" stroke="#2D9CDB" stroke-width="0.8" opacity="0.4"/>
    <line x1="-60" y1="-35" x2="-60" y2="35" stroke="#2D9CDB" stroke-width="0.8" opacity="0.4"/>
    <line x1="-60" y1="35" x2="60" y2="35" stroke="#2D9CDB" stroke-width="0.8" opacity="0.4"/>
    <line x1="60" y1="35" x2="-60" y2="-35" stroke="#2D9CDB" stroke-width="0.8" opacity="0.3"/>
    <line x1="60" y1="-35" x2="-60" y2="35" stroke="#2D9CDB" stroke-width="0.8" opacity="0.3"/>

    <line x1="0" y1="0" x2="60" y2="-35" stroke="#56CCF2" stroke-width="0.9" opacity="0.6"/>
    <line x1="0" y1="0" x2="60" y2="35" stroke="#56CCF2" stroke-width="0.9" opacity="0.6"/>
    <line x1="0" y1="0" x2="-60" y2="-35" stroke="#56CCF2" stroke-width="0.9" opacity="0.6"/>
    <line x1="0" y1="0" x2="-60" y2="35" stroke="#56CCF2" stroke-width="0.9" opacity="0.6"/>
    <line x1="0" y1="0" x2="0" y2="-68" stroke="#56CCF2" stroke-width="0.9" opacity="0.6"/>
    <line x1="0" y1="0" x2="0" y2="68" stroke="#56CCF2" stroke-width="0.9" opacity="0.6"/>


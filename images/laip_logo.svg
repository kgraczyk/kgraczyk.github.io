    <circle cx="60" cy="-35" r="5" fill="#0B3F6E" stroke="#2D9CDB" stroke-width="1.5"/>
    <circle cx="60" cy="35" r="5" fill="#0B3F6E" stroke="#2D9CDB" stroke-width="1.5"/>
    <circle cx="0" cy="68" r="5" fill="#0B3F6E" stroke="#2D9CDB" stroke-width="1.5"/>
    <circle cx="-60" cy="35" r="5" fill="#0B3F6E" stroke="#2D9CDB" stroke-width="1.5"/>
    <circle cx="-60" cy="-35" r="5" fill="#0B3F6E" stroke="#2D9CDB" stroke-width="1.5"/>

    <circle cx="30" cy="-52" r="3.5" fill="#1A6FBF" stroke="#56CCF2" stroke-width="1.2"/>
    <circle cx="60" cy="0" r="3.5" fill="#1A6FBF" stroke="#56CCF2" stroke-width="1.2"/>
